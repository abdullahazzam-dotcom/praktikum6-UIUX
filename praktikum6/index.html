<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>praktikum javascript</title>
</head>
<body>
    <h2>praktikum basic javascript</h2>
    <p>lihat hasil melalui console</p>

    <script>
        const nama = "alya";
        let umur = 19;
        let nilai1 = 85;
        let aktif = true;

        console.log("nama:", nama);
        console.log("Umur:", umur);
        console.log("Nilai:", nilai1);
        console.log("Status aktif:", aktif);
        console.log("Tipe nilai:", typeof nilai1);

        const tugas = 80;
        const uts = 75;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.30 *0.40;

        console.log("Nilai akhir:", akhir);
        console.log("Lulus:", akhir >= 60);

       // const nilai = 78;
        let kategori;
        if (nilai1 >= 85) {
            kategori = "A";
        } else if (nilai1 >= 70) {
            kategori = "B";
        } else if (nilai1 >= 60) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("Nilai:" , nilai1);
        console.log("Kategori:" , kategori);

        function hitungDiskon(harga, persen) {
            return harga - (harga * persen / 100);x`x`
        }
        
        for (let i = 0; i <= 3; i++) {
            const harga = i * 10000
            const bayar = hitungDiskon(harga, 10);
            console.log("Barang", i, "Harga:", harga, "Bayar:", bayar);
            
        }
    </script>
